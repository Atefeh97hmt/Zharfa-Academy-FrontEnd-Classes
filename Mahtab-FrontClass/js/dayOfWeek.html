<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Day of the Week</title>
</head>
<body>
    <style>
        body{
    font-family: Arial, Helvetica, sans-serif;
    margin: 50px;
    background: #fff;
}

#container{
    width: 650px;
    height: 350px;
    background-color: #00ffff;
    margin: auto;
    border-radius: 30px;
}

h1{
    font-size: 47px;
    font-weight: 600;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 20px;
    margin-left: 170px;
    background: #0000ff;
    padding: 10px;
    border-radius: 5px;
    display: inline-block;
}

#weekday{
    font-size: 80px;
    color: #dd5800;
    font-weight: 800;
    margin-left: 170px;
}

#phrase{
    font-size: 40px;
    color: #0000ff;
    font-weight: 800;
    margin-left: 170px;
}
    </style>
    <div id="container">
        <h1>نمایش روز هفته</h1>
        <div>
            <span id="weekday">
                Display day of the week.
            </span></br>
            <span id="phrase">Display a quote</span>
        </div>
    </div>
    <script>

//Grab day of the week from local computer
let date = new Date();
let dayOfWeekNumber = date.getDay();
let nameOfDay;
let quote;

switch(dayOfWeekNumber){
    case 0:
        nameOfDay = 'یکشنبه';
        quote = 'سلام ';
        break;
    case 1:
        nameOfDay = 'دوشنبه';
        quote = 'به مجله خوش آمدید';
        break;
    case 2:
        nameOfDay = 'سه شنبه';
        quote = 'مجله ';
        break;
    case 3:
        nameOfDay = 'چهارشنبه';
        quote = 'سلام .';
        break;
    case 4:
        nameOfDay = 'پنج شنبه';
        quote = 'دانشگاه ';
        break;
    case 5:
        nameOfDay = 'جمعه';
        quote = 'سلام ';
        break;
    case 6:
        nameOfDay = 'شنبه';
        quote = 'مجله !';
        break;

}
//Display the day of the week
let weekdayDiv = document.getElementById('weekday');
weekdayDiv.innerHTML = `${nameOfDay}`;

//Display quote
let quoteDiv = document.getElementById('phrase');
quoteDiv.innerHTML = `${quote}`

    </script>
</body>
</html>
